<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carregando... — Planiloja Achadinhos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
    rel="stylesheet">
  <style>
    /* ============================================
    CSS VARIABLES — Defaults
    ============================================ */
    :root {
      --primary: #3483FA;
      --primary-rgb: 52, 131, 250;
      --primary-light: rgba(52, 131, 250, 0.08);
      --primary-hover: #2968C8;
      --secondary: #1B1B1B;
      --secondary-hover: #000000;
      --secondary-light: rgba(27, 27, 27, 0.08);
      --bg: #FAFAF8;
      --white: #FFFFFF;
      --gray-50: #F7F7F5;
      --gray-100: #EFEFEC;
      --gray-200: #E0DED9;
      --gray-300: #C8C5BE;
      --gray-400: #A8A49C;
      --gray-500: #87837A;
      --gray-600: #6B6760;
      --gray-700: #4A4740;
      --gray-800: #2D2B27;
      --text: #1B1B1B;
      --text-muted: #6B6760;
      --text-light: #87837A;
      --radius: 10px;
      --radius-sm: 6px;
      --radius-lg: 14px;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.1);
      --shadow-xl: 0 16px 48px rgba(0, 0, 0, 0.12);
      --transition: 0.2s ease;
      --font: 'DM Sans', -apple-system, sans-serif;
    }

    /* ============================================
    RESET & BASE
    ============================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    html, body { overflow-x: hidden; max-width: 100vw; }
    body.modal-open { position: fixed; width: 100%; height: 100%; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.6; -webkit-font-smoothing: antialiased; }
    img { max-width: 100%; display: block; }
    button { cursor: pointer; font-family: var(--font); border: none; }
    input, select, textarea { font-family: var(--font); }
    a { color: inherit; text-decoration: none; }

    /* ============================================
    LOADING & ERROR SCREENS
    ============================================ */
    .loading-screen { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.4s ease; }
    .loading-screen.hidden { opacity: 0; pointer-events: none; }
    .loading-spinner { width: 40px; height: 40px; border: 3px solid var(--gray-200); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { margin-top: 16px; font-size: 0.9rem; color: var(--text-muted); }
    .error-screen { display: none; max-width: 500px; margin: 80px auto; padding: 40px; text-align: center; background: var(--white); border-radius: var(--radius-lg); border: 1px solid var(--gray-200); }
    .error-screen.show { display: block; }
    .error-screen h2 { font-size: 1.2rem; margin-bottom: 8px; }
    .error-screen p { color: var(--text-muted); font-size: 0.9rem; }

    /* FAIXA SUPERIOR AMARELA */
    .top-bar { background: #FFE600 !important; color: #1B1B1B !important; text-align: center; padding: 9px 20px; font-size: 0.85rem; font-weight: 600; letter-spacing: 0.01em; display: none; }
    .top-bar.show { display: block; }

    /* ============================================
    HEADER & NAV
    ============================================ */
    .header { background: var(--white); border-bottom: 1px solid var(--gray-200); position: sticky; top: 0; z-index: 100; }
    .header-inner { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; height: 68px; gap: 16px; }
    .header-logo { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .header-logo img { max-height: 44px; max-width: 160px; width: auto; height: auto; border-radius: 6px; object-fit: contain; }
    .header-logo span { font-weight: 700; font-size: 1.15rem; color: #1B1B1B; letter-spacing: -0.02em; }
    .search-clear { display: none !important; }
    .search-clear.show { display: flex !important; }
    .search-bar { flex: 1; max-width: 420px; position: relative; }
    .search-bar input { width: 100%; padding: 10px 36px 10px 42px; border: 1.5px solid var(--gray-200); border-radius: 50px; font-size: 0.9rem; background: var(--gray-50); transition: var(--transition); color: var(--text); outline: none; }
    .search-bar input:focus { border-color: var(--primary); background: var(--white); box-shadow: 0 0 0 3px var(--primary-light); }
    .search-bar input::placeholder { color: var(--gray-400); }
    .search-bar svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--gray-400); width: 18px; height: 18px; }
    .header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .channel-btn { display: none; align-items: center; gap: 8px; background: #25D366; color: var(--white); padding: 10px 16px; border-radius: 50px; font-size: 0.85rem; font-weight: 600; transition: var(--transition); white-space: nowrap; }
    .channel-btn.show { display: flex; }
    .channel-btn:hover { filter: brightness(0.93); transform: translateY(-1px); }
    .channel-btn.telegram { background: #229ED9; }
    .channel-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
    .search-toggle { display: none; background: none; color: var(--gray-700); padding: 8px; }
    .search-toggle svg { width: 22px; height: 22px; }

    .cat-nav { background: var(--white); border-bottom: 1px solid var(--gray-100); }
    .cat-nav-inner { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; gap: 4px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .cat-nav-inner::-webkit-scrollbar { display: none; }
    .cat-btn { padding: 12px 18px; font-size: 0.88rem; font-weight: 500; color: var(--text-muted); background: none; white-space: nowrap; border-bottom: 2px solid transparent; transition: var(--transition); letter-spacing: -0.01em; }
    .cat-btn:hover { color: var(--text); }
    .cat-btn.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }

    .subcat-bar { max-width: 1200px; margin: 0 auto; padding: 16px 20px 0; display: none; gap: 8px; flex-wrap: wrap; }
    .subcat-bar.show { display: flex; }
    .subcat-btn { padding: 7px 16px; font-size: 0.82rem; font-weight: 500; background: var(--white); border: 1.5px solid var(--gray-200); border-radius: 50px; color: var(--text-muted); transition: var(--transition); }
    .subcat-btn:hover { border-color: var(--primary); color: var(--primary); }
    .subcat-btn.active { background: var(--primary); border-color: var(--primary); color: var(--white); }

    /* ============================================
    BANNER & PRODUCTS GRID
    ============================================ */
    .banner { max-width: 1200px; margin: 20px auto; padding: 0 20px; display: none; }
    .banner.show { display: block; }
    .banner a, .banner div.banner-wrap { display: block; border-radius: var(--radius-lg); overflow: hidden; position: relative; background: transparent; box-shadow: var(--shadow-sm); }
    .banner-img { width: 100%; height: auto; display: block; border-radius: var(--radius-lg); object-fit: contain; }
    .banner-overlay { position: absolute; inset: 0; background: transparent; display: flex; flex-direction: column; justify-content: center; padding: 30px 40px; pointer-events: none; }
    .banner-tag { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: rgba(255, 255, 255, 0.95); text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6); margin-bottom: 8px; }
    .banner-title { font-size: 1.8rem; font-weight: 700; color: var(--white); letter-spacing: -0.03em; line-height: 1.2; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7); margin-bottom: 6px; }
    .banner-sub { font-size: 0.95rem; color: rgba(255, 255, 255, 0.9); text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6); }

    .main { max-width: 1200px; margin: 0 auto; padding: 24px 20px 80px; }
    .section-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 20px; }
    .section-title { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.02em; color: var(--secondary); }
    .product-count { font-size: 0.85rem; color: var(--text-light); }
    .products-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
    .product-card { background: var(--white); border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--gray-100); transition: var(--transition); cursor: pointer; position: relative; }
    .product-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); border-color: var(--gray-200); }
    .product-img-wrap { position: relative; aspect-ratio: 1; overflow: hidden; background: var(--gray-50); }
    .product-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
    .product-card:hover .product-img-wrap img { transform: scale(1.05); }

    .badge-promo { position: absolute; top: 10px; left: 10px; background: #E53E3E; color: white; font-size: 0.7rem; font-weight: 700; padding: 4px 10px; border-radius: 50px; letter-spacing: 0.02em; text-transform: uppercase; z-index: 2; }
    .badge-platform { position: absolute; top: 10px; right: 10px; background: rgba(0, 0, 0, 0.65); color: var(--white); font-size: 0.68rem; font-weight: 600; padding: 4px 10px; border-radius: 50px; letter-spacing: 0.02em; backdrop-filter: blur(2px); max-width: 46%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; z-index: 2; }
    .badge-limited { position: absolute; bottom: 10px; left: 10px; background: #B45309; color: var(--white); font-size: 0.62rem; font-weight: 700; padding: 4px 8px; border-radius: var(--radius-sm); letter-spacing: 0.04em; text-transform: uppercase; }

    .product-info { padding: 14px 16px 16px; }
    .product-cat { font-size: 0.73rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-light); font-weight: 500; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .product-name { font-size: 0.95rem; font-weight: 600; color: var(--secondary); margin-bottom: 8px; letter-spacing: -0.01em; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .product-price { display: flex; align-items: baseline; gap: 8px; row-gap: 0; flex-wrap: wrap; margin-bottom: 12px; }
    .price-current { font-size: 1.1rem; font-weight: 700; color: var(--primary); white-space: nowrap; }
    .price-old { font-size: 0.85rem; color: var(--gray-400); text-decoration: line-through; white-space: nowrap; }
    .btn-details { width: 100%; padding: 10px; background: var(--gray-50); border: 1.5px solid var(--gray-200); border-radius: var(--radius); font-size: 0.85rem; font-weight: 600; color: var(--text); transition: var(--transition); }
    .btn-details:hover { background: var(--primary); border-color: var(--primary); color: var(--white); }
    .no-results { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--text-light); }
    .no-results svg { width: 48px; height: 48px; margin: 0 auto 12px; color: var(--gray-300); }

    /* ============================================
    PRODUCT DETAIL MODAL & CTA BUTTON
    ============================================ */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.open { display: flex; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .modal { background: var(--white); border-radius: var(--radius-lg); max-width: 800px; width: 100%; max-height: 90vh; overflow-y: auto; animation: slideUp 0.3s ease; position: relative; }
    .modal-close { position: absolute; top: 16px; right: 16px; width: 36px; height: 36px; border-radius: 50%; background: var(--white); border: 1px solid var(--gray-200); display: flex; align-items: center; justify-content: center; z-index: 10; color: var(--gray-600); transition: var(--transition); box-shadow: var(--shadow-sm); }
    .modal-close:hover { background: var(--gray-50); }
    .modal-close svg { width: 18px; height: 18px; }
    .modal-body { display: grid; grid-template-columns: 1fr 1fr; }
    .modal-left { display: flex; flex-direction: column; }
    .modal-gallery { aspect-ratio: 1; background: var(--gray-50); overflow: hidden; }
    .modal-gallery img { width: 100%; height: 100%; object-fit: cover; }
    .gallery-thumbs { display: flex; gap: 8px; padding: 12px 16px; justify-content: center; background: var(--gray-50); border-top: 1px solid var(--gray-200); }
    .gallery-thumb { width: 56px; height: 56px; border-radius: 8px; overflow: hidden; border: 2px solid transparent; cursor: pointer; opacity: 0.6; transition: all 0.2s ease; background: var(--white); flex-shrink: 0; }
    .gallery-thumb:hover { opacity: 0.9; }
    .gallery-thumb.active { border-color: var(--primary); opacity: 1; }
    .gallery-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .modal-details { padding: 32px; display: flex; flex-direction: column; overflow-y: auto; max-height: 100%; }
    .modal-cat { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--primary); font-weight: 600; margin-bottom: 8px; }
    .modal-name { font-size: 1.5rem; font-weight: 700; color: var(--secondary); letter-spacing: -0.03em; line-height: 1.25; margin-bottom: 12px; }
    .modal-price { display: flex; align-items: baseline; gap: 10px; margin-bottom: 16px; }
    .modal-price .price-current { font-size: 1.5rem; }
    .modal-price .price-old { font-size: 1rem; }
    .modal-desc { font-size: 0.9rem; color: var(--text-muted); line-height: 1.65; margin-bottom: 24px; flex: 1; white-space: pre-line; }
    .coupon-box { display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 1.5px dashed var(--primary); background: var(--primary-light); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 20px; }
    .coupon-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 2px; }
    .coupon-code { font-size: 1.05rem; font-weight: 700; letter-spacing: 0.06em; color: var(--primary); }
    .coupon-copy { background: var(--primary); color: var(--white); padding: 9px 14px; border-radius: var(--radius-sm); font-size: 0.78rem; font-weight: 600; white-space: nowrap; transition: var(--transition); }
    .coupon-copy:hover { background: var(--primary-hover); }
    .video-embed { position: relative; width: 100%; aspect-ratio: 16/9; border-radius: var(--radius); overflow: hidden; background: #000; margin-bottom: 20px; }
    .video-embed iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    
    .btn-cta { width: 100%; padding: 14px 20px; background: var(--primary, #3483FA) !important; color: #FFFFFF !important; border-radius: var(--radius); font-size: 1rem; font-weight: 700; transition: all 0.2s ease; display: flex !important; align-items: center; justify-content: center; gap: 8px; position: relative; z-index: 2; box-shadow: 0 4px 14px rgba(52, 131, 250, 0.3); cursor: pointer; text-decoration: none; border: none; outline: none; }
    .btn-cta:hover { background: var(--primary-hover, #2968C8) !important; color: #FFFFFF !important; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(52, 131, 250, 0.45); }
    .btn-cta:active { transform: translateY(0); }
    
    .price-note { display: none; font-size: 0.72rem; color: var(--text-light); text-align: center; margin-top: 10px; }
    .price-note.show { display: block; }
    
    .channel-float { position: fixed; bottom: 24px; left: 24px; width: 54px; height: 54px; border-radius: 50%; background: #25D366; color: var(--white); display: none; align-items: center; justify-content: center; box-shadow: var(--shadow-lg); z-index: 60; transition: all 0.3s ease; }
    .channel-float.show { display: flex; }
    .channel-float:hover { transform: translateY(-2px); box-shadow: var(--shadow-xl); }
    .channel-float.telegram { background: #229ED9; }
    .channel-float svg { width: 26px; height: 26px; }
    body.has-channel-float .back-to-top { bottom: 88px; }
    .footer-disclosure { max-width: 640px; margin: 0 auto 12px; font-size: 0.75rem; line-height: 1.5; opacity: 0.75; }

    /* ============================================
    FOOTER & MISC
    ============================================ */
    .footer { background: #1B1B1B; color: rgba(255,255,255,0.5); padding: 36px 20px; text-align: center; }
    .footer-name { font-size: 1rem; font-weight: 600; color: #FFFFFF; margin-bottom: 12px; }
    .footer-socials { display: flex; justify-content: center; gap: 16px; margin-bottom: 16px; }
    .footer-socials a { width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.7); transition: all 0.2s ease; }
    .footer-socials a:hover { background: var(--primary); color: #FFFFFF; }
    .footer-socials svg { width: 18px; height: 18px; }
    .footer-credit { font-size: 0.78rem; color: rgba(255,255,255,0.35); }

    .toast { position: fixed; bottom: 24px; right: 24px; background: var(--white); border: 1px solid var(--gray-200); padding: 14px 18px; border-radius: var(--radius-lg); font-size: 0.88rem; font-weight: 500; z-index: 150; box-shadow: var(--shadow-xl); transform: translateY(20px); opacity: 0; transition: all 0.3s ease; display: flex; align-items: center; gap: 12px; max-width: 340px; color: var(--text); }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast-img { width: 48px; height: 48px; border-radius: var(--radius); object-fit: cover; flex-shrink: 0; }
    .toast-content { flex: 1; min-width: 0; }
    .toast-title { font-size: 0.82rem; font-weight: 700; color: var(--text); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .toast-subtitle { font-size: 0.78rem; color: var(--text-light); }

    .btn-copy-link { display: flex; align-items: center; justify-content: center; gap: 5px; background: none; border: none; font-size: 0.78rem; font-weight: 500; color: var(--text-light); cursor: pointer; padding: 6px 0; margin-top: 6px; transition: all 0.2s ease; position: relative; z-index: 1; width: fit-content; margin-left: auto; margin-right: auto; }
    .btn-copy-link:hover { color: var(--primary); }
    .btn-copy-link.copied { color: var(--primary); font-weight: 600; }
    .btn-copy-link svg { width: 14px; height: 14px; }

    @keyframes cardFadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .product-card { animation: cardFadeIn 0.4s ease both; }
    .product-card:nth-child(1) { animation-delay: 0.03s; }
    .product-card:nth-child(2) { animation-delay: 0.06s; }
    .product-card:nth-child(3) { animation-delay: 0.09s; }
    .product-card:nth-child(4) { animation-delay: 0.12s; }
    .product-card:nth-child(5) { animation-delay: 0.15s; }
    .product-card:nth-child(6) { animation-delay: 0.18s; }
    .product-card:nth-child(7) { animation-delay: 0.21s; }
    .product-card:nth-child(8) { animation-delay: 0.24s; }

    .back-to-top { position: fixed; bottom: 24px; left: 24px; width: 44px; height: 44px; background: var(--white); border: 1px solid var(--gray-200); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--gray-500); cursor: pointer; box-shadow: var(--shadow-md); transition: all 0.3s ease; opacity: 0; pointer-events: none; z-index: 50; }
    .back-to-top.show { opacity: 1; pointer-events: auto; }
    .back-to-top:hover { background: var(--primary); border-color: var(--primary); color: var(--white); transform: translateY(-2px); box-shadow: var(--shadow-lg); }
    .back-to-top svg { width: 20px; height: 20px; }

    #featuredSection { background: var(--primary-light); border-radius: var(--radius-lg); padding: 24px; margin-bottom: 32px; }
    #featuredSection .section-title { color: var(--primary); font-size: 1.1rem; margin-bottom: 16px; }
    #featuredGrid { grid-template-columns: repeat(3, 1fr) !important; }

    /* ============================================
    RESPONSIVE (Ajustes visuais para Celular)
    ============================================ */
    @media (max-width: 1024px) {
      .products-grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 768px) {
      #featuredGrid { grid-template-columns: repeat(2, 1fr) !important; }
      #featuredSection { padding: 16px; }
      .search-bar input { font-size: 16px !important; }
      .header-inner { height: 58px; padding: 0 12px !important; gap: 8px !important; }
      .header-logo { min-width: 0 !important; flex-shrink: 1 !important; }
      .header-logo img { max-height: 36px !important; max-width: 100px !important; }
      .header-logo span { font-size: 0.95rem !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; }
      .header-actions { flex-shrink: 0 !important; }
      .channel-btn span { display: none; }
      .channel-btn { width: 40px !important; height: 40px !important; padding: 0 !important; justify-content: center; flex-shrink: 0 !important; }
      .search-toggle { flex-shrink: 0 !important; display: block; }
      .search-bar { display: none; }
      .search-bar.mobile-open { display: block; position: absolute; top: 58px; left: 0; right: 0; padding: 10px 16px; background: var(--white); border-bottom: 1px solid var(--gray-200); max-width: 100%; z-index: 99; }
      .products-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .banner-img { height: auto !important; }
      .banner-overlay { padding: 16px 20px; }
      .banner-title { font-size: 1.2rem; }
      .modal-body { grid-template-columns: 1fr !important; }
      .modal-left { width: 100%; }
      .modal-gallery { aspect-ratio: 4/3 !important; }
      .modal-details { padding: 20px 16px !important; max-height: none !important; overflow-y: visible !important; }
      .modal-overlay { padding: 0 !important; align-items: flex-start !important; }
      .modal { max-width: 100vw !important; width: 100% !important; max-height: 100vh !important; height: 100vh !important; border-radius: 0 !important; overflow-y: auto !important; }
      .banner { padding: 0 12px; }
    }

    @media (max-width: 480px) {
      #featuredGrid { grid-template-columns: repeat(2, 1fr) !important; }
      #featuredSection { padding: 14px; }
      .products-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .badge-promo { top: 6px; left: 6px; font-size: 0.6rem; padding: 3px 6px; }
      .badge-platform { top: 6px; right: 6px; font-size: 0.58rem; padding: 3px 6px; max-width: 65%; }
      .product-info { padding: 8px 10px 10px; }
      .product-cat { font-size: 0.65rem; }
      .product-name { font-size: 0.85rem; line-height: 1.2; margin-bottom: 6px; }
      .price-current { font-size: 0.95rem; }
      .price-old { font-size: 0.75rem; }
      .btn-details { padding: 8px; font-size: 0.8rem; }
      .modal-name { font-size: 1.2rem; }
      .modal-price .price-current { font-size: 1.2rem; }
    }
  </style>
</head>

  <!-- FAIXA TOPO -->

  <!-- Header -->
  <header class="header" style="display:none" id="siteHeader">

        <button type="button" class="search-clear" id="searchClear" onclick="clearSearch()" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:var(--gray-200);border:none;width:20px;height:20px;border-radius:50%;font-size:0.7rem;color:var(--gray-600);cursor:pointer;align-items:center;justify-content:center;padding:0;line-height:1">✕</button>

            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />

          <button class='btn-copy-link' id='btnCopyLink' onclick='copyProductLink()'><svg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24' stroke-width='2' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' d='M7.217 10.907a2.25 2.25 0 100 2.186m0-2.186c.18.324.283.696.283 1.093s-.103.77-.283 1.093m0-2.186l9.566-5.314m-9.566 7.5l9.566 5.314m0-12.814a2.25 2.25 0 103.935 2.186 2.25 2.25 0 00-3.935-2.186zm0 12.814a2.25 2.25 0 103.933-2.185 2.25 2.25 0 00-3.933 2.185z'/></svg><span id='copyLinkText'>Compartilhar</span></button>

  <!-- Footer -->

  <button class='back-to-top' id='backToTop' onclick='window.scrollTo({top:0,behavior:"smooth"})'>
    <svg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24' stroke-width='2.5' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' d='M4.5 15.75l7.5-7.5 7.5 7.5'/></svg>

  <!-- Toast -->

    <div class="toast-content">
      <div class="toast-title" id="toastTitle"></div>
      <div class="toast-subtitle" id="toastSubtitle"></div>
    </div>
  </div>

  <!-- ========================================================================= -->
  <!-- CONFIGURAÇÃO BLINDADA (IGNORA O ARQUIVO CONFIG.JS EXTERNO)                 -->
  <!-- ========================================================================= -->
  <script>
    // As variáveis estão injetadas diretamente aqui para evitar qualquer falha externa
    const ACHADINHOS = {
      planilha_configuracoes: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ_5XiBT9b521Uk3-H2UhfTB6Scbg7WpBRT1X5fURSL8zym27h9Z_mY8eYK9IeKl_UYSW3E1O98C4l4/pub?gid=480609827&single=true&output=csv",
      planilha_catalogo: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ_5XiBT9b521Uk3-H2UhfTB6Scbg7WpBRT1X5fURSL8zym27h9Z_mY8eYK9IeKl_UYSW3E1O98C4l4/pub?gid=952991100&single=true&output=csv",
      registrar_cliques: ""
    };

    // ============================================
    // APP ENGINE — Planiloja Achadinhos
    // ============================================

    let CONFIG = {};
    let PRODUCTS = [];
    let activeCategory = "Todos";
    let activeSubcategory = null;
    let currentProduct = null;

    function parseCSV(text) {
      const lines = [];
      let current = '';
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (ch === '"') {
          if (inQuotes && text[i + 1] === '"') { current += '"'; i++; }
          else { inQuotes = !inQuotes; }
        } else if (ch === ',' && !inQuotes) {
          lines.push(current); current = '';
        } else if ((ch === '\n' || ch === '\r') && !inQuotes) {
          if (ch === '\r' && text[i + 1] === '\n') i++;
          lines.push(current); current = ''; lines.push('\n');
        } else { current += ch; }
      }
      if (current) lines.push(current);

      const rows = [];
      let row = [];
      for (const token of lines) {
        if (token === '\n') { if (row.length > 0) rows.push(row); row = []; }
        else { row.push(token.trim()); }
      }
      if (row.length > 0) rows.push(row);
      return rows;
    }

    function resolveColor(val) {
      if (!val) return null;
      var s = String(val).trim();
      var low = s.toLowerCase();
      var paletas = {
        'preto': '#1B1B1B', 'black': '#1B1B1B',
        'branco': '#FFFFFF', 'white': '#FFFFFF',
        'amarelo': '#FFE600', 'amarelo mercado livre': '#FFE600', 'yellow': '#FFE600',
        'azul': '#3483FA', 'azul mercado livre': '#3483FA', 'blue': '#3483FA',
        'verde': '#2A5C3F', 'green': '#25D366',
        'vermelho': '#DC2626', 'red': '#DC2626',
        'roxo': '#7C3AED', 'rosa': '#DB2777',
        'laranja': '#EA580C', 'dourado': '#B8860B',
        'marrom': '#78350F', 'cinza': '#6B6760', 'turquesa': '#0D9488'
      };
      if (paletas[low]) return paletas[low];
      var clean = s.replace('#', '');
      if (clean.length === 3 || clean.length === 6) {
        if (/^[0-9A-Fa-f]+$/.test(clean)) { return '#' + clean; }
      }
      return s;
    }

    async function loadConfig() {
      const ts = Date.now();
      const res = await fetch(ACHADINHOS.planilha_configuracoes + '&_t=' + ts, { cache: 'no-store' });
      const text = await res.text();
      const rows = parseCSV(text);

      const cfg = {};

      for (const row of rows) {
        if (!row[0] && !row[1]) continue;
        const field = (row[0] || '').replace(/[⚙️📋🎨🚚🏷️💳💡📊]/g, '').trim().toUpperCase();
        const val = (row[1] || '').trim();

        if (field === 'CAMPO' || field === 'VALOR' || field === 'INSTRUÇÕES' || field === '') continue;
        if (field.includes('CONFIGURAÇÕES') || field.includes('PREENCHA')) continue;
        if (field.includes('DADOS DA LOJA') || field.includes('PERSONALIZAÇÃO') || field.includes('CANAL DE OFERTAS') || field.includes('AVISOS') || field.includes('RASTREAMENTO')) continue;

        if (field === 'NOME DA LOJA') cfg.storeName = val;
        else if (field === 'LOGO (URL)') cfg.logo = val;
        else if (field === 'INSTAGRAM') cfg.instagram = val;
        else if (field === 'FACEBOOK') cfg.facebook = val;
        else if (field === 'TIKTOK') cfg.tiktok = val;
        else if (field === 'PIXEL FACEBOOK') cfg.pixelFacebook = val;
        else if (field === 'GOOGLE ANALYTICS') cfg.googleAnalytics = val;
        else if (field === 'GOOGLE ADS') cfg.googleAds = val;
        else if (field === 'COR PRIMÁRIA' || field === 'COR PRIMARIA') cfg.corPrimaria = val;
        else if (field === 'BANNER (URL)') cfg.bannerUrl = val;
        else if (field === 'BANNER LINK') cfg.bannerLink = val;
        else if (field === 'BANNER TAG') cfg.bannerTag = val;
        else if (field === 'BANNER TÍTULO' || field === 'BANNER TITULO') cfg.bannerTitulo = val;
        else if (field === 'BANNER SUBTÍTULO' || field === 'BANNER SUBTITULO') cfg.bannerSubtitulo = val;
        else if (field === 'TITULO DO SITE' || field === 'TÍTULO DO SITE' || field === 'TITULO DA PAGINA') cfg.tituloSite = val;
        else if (field === 'DESCRICAO DO SITE' || field === 'DESCRIÇÃO DO SITE' || field === 'META DESCRICAO' || field === 'META DESCRIÇÃO') cfg.descricaoSite = val;
        else if (field === 'LOJA ATIVA') cfg.lojaAtiva = val.toUpperCase() !== 'NÃO' && val.toUpperCase() !== 'NAO';
        else if (field === 'MENSAGEM MANUTENCAO' || field === 'MENSAGEM MANUTENÇÃO' || field === 'MENSAGEM MANUTENÇAO') cfg.msgManutencao = val;
        else if (field === 'MENSAGEM TOPO' || field === 'BARRA TOPO') cfg.mensagemTopo = val;
        else if (field === 'COR BARRA TOPO' || field === 'COR MENSAGEM TOPO' || field === 'COR DA BARRA TOPO') cfg.corBarraTopo = val;
        else if (field === 'COR TEXTO TOPO' || field === 'COR TEXTO BARRA TOPO' || field === 'COR DO TEXTO TOPO' || field === 'COR DO TEXTO') cfg.corTextoTopo = val;
        else if (field === 'CNPJ') cfg.cnpj = val;
        else if (field === 'ENDERECO' || field === 'ENDEREÇO' || field === 'ENDERECO DA LOJA' || field === 'ENDEREÇO DA LOJA') cfg.endereco = val;
        else if (field === 'EMAIL' || field === 'EMAIL DE CONTATO') cfg.email = val;
        else if (field === 'CANAL WHATSAPP') cfg.canalWhatsapp = val;
        else if (field === 'CANAL TELEGRAM') cfg.canalTelegram = val;
        else if (field === 'BOTÃO CANAL FLUTUANTE' || field === 'BOTAO CANAL FLUTUANTE') cfg.botaoCanalFlutuante = val.toUpperCase() === 'SIM';
        else if (field === 'TEXTO DISCLOSURE') cfg.textoDisclosure = val;
        else if (field === 'AVISO PREÇOS' || field === 'AVISO PRECOS') cfg.avisoPrecos = val;
      }

      if (!cfg.textoDisclosure) cfg.textoDisclosure = 'Este site participa de programas de afiliados e pode receber comissão pelas compras realizadas nos links, sem custo adicional para você.';
      if (!cfg.avisoPrecos) cfg.avisoPrecos = 'Preços e disponibilidade sujeitos a alteração. Confirme na loja parceira.';
      CONFIG = cfg;
    }

    async function loadCatalogo() {
      const ts = Date.now();
      const res = await fetch(ACHADINHOS.planilha_catalogo + '&_t=' + ts, { cache: 'no-store' });
      const text = await res.text();
      const rows = parseCSV(text);

      const products = [];
      for (const row of rows) {
        const first = (row[0] || '').trim().toUpperCase();
        if (!first || first === 'ATIVO' || first === 'ATIVO *' || first === 'SIM OU NÃO' || first.includes('CATÁLOGO') || first.includes('CATALOGO') || first.includes('CADA LINHA') || first.includes('DICAS')) continue;
        if (first !== 'SIM') continue;

        products.push({
          ativo: true,
          tipo: ((row[1] || '').trim().toUpperCase() === 'DIGITAL') ? 'DIGITAL' : 'FISICO',
          plataforma: (row[2] || '').trim(),
          categoria: (row[3] || '').trim(),
          subcategoria: (row[4] || '').trim(),
          nome: (row[5] || '').trim(),
          descricao: (row[6] || '').trim(),
          preco: parsePrecoBR(row[7]),
          precoPromo: row[8] ? (parsePrecoBR(row[8]) || null) : null,
          cupom: (row[9] || '').trim(),
          validade: parseDataBR(row[10]),
          linkAfiliado: (row[11] || '').trim(),
          textoBotao: (row[12] || '').trim(),
          video: (row[13] || '').trim(),
          img1: fixImg((row[14] || '').trim()),
          img2: fixImg((row[15] || '').trim()),
          img3: fixImg((row[16] || '').trim()),
          img4: fixImg((row[17] || '').trim()),
          ordem: parseInt(row[18]) || 9999,
          destaque: row.length > 19 && (row[19] || '').trim().toUpperCase() === 'SIM',
        });
      }
      PRODUCTS = products.filter(p => p.nome && p.linkAfiliado && ofertaValida(p));
    }

    function parseDataBR(val) {
      var s = (val || '').trim();
      if (!s) return null;
      var m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if (!m) return null;
      var d = new Date(parseInt(m[3], 10), parseInt(m[2], 10) - 1, parseInt(m[1], 10), 23, 59, 59);
      return isNaN(d.getTime()) ? null : d;
    }

    function ofertaValida(p) {
      if (!p.validade) return true;
      return new Date() <= p.validade;
    }

    function ofertaExpiraEmBreve(p) {
      if (!p.validade) return false;
      var diff = p.validade.getTime() - Date.now();
      return diff > 0 && diff <= 48 * 60 * 60 * 1000;
    }

    function applyConfig() {
      document.title = CONFIG.tituloSite || (CONFIG.storeName ? CONFIG.storeName + ' — Achadinhos' : 'Achadinhos');
      if (CONFIG.descricaoSite) {
        var metaDesc = document.querySelector('meta[name="description"]');
        if (!metaDesc) { metaDesc = document.createElement('meta'); metaDesc.name = 'description'; document.head.appendChild(metaDesc); }
        metaDesc.content = CONFIG.descricaoSite;
      }
      var ogTitle = document.querySelector('meta[property="og:title"]');
      if (!ogTitle) { ogTitle = document.createElement('meta'); ogTitle.setAttribute('property', 'og:title'); document.head.appendChild(ogTitle); }
      ogTitle.content = CONFIG.tituloSite || CONFIG.storeName || 'Achadinhos';
      if (CONFIG.descricaoSite) {
        var ogDesc = document.querySelector('meta[property="og:description"]');
        if (!ogDesc) { ogDesc = document.createElement('meta'); ogDesc.setAttribute('property', 'og:description'); document.head.appendChild(ogDesc); }
        ogDesc.content = CONFIG.descricaoSite;
      }
      if (CONFIG.bannerUrl) {
        var ogImg = document.querySelector('meta[property="og:image"]');
        if (!ogImg) { ogImg = document.createElement('meta'); ogImg.setAttribute('property', 'og:image'); document.head.appendChild(ogImg); }
        ogImg.content = fixImg(CONFIG.bannerUrl);
      }
      var ogType = document.querySelector('meta[property="og:type"]');
      if (!ogType) { ogType = document.createElement('meta'); ogType.setAttribute('property', 'og:type'); document.head.appendChild(ogType); }
      ogType.content = 'website';
      document.getElementById('headerName').textContent = CONFIG.storeName || 'Minha Loja';
      document.getElementById('footerName').textContent = CONFIG.storeName || 'Minha Loja';

      if (CONFIG.logo) {
        const logo = document.getElementById('headerLogo');
        logo.src = fixImg(CONFIG.logo);
        logo.style.display = 'block';
        logo.onerror = function () { this.style.display = 'none'; };
        var favicon = document.querySelector('link[rel="icon"]');
        if (!favicon) {
          favicon = document.createElement('link');
          favicon.rel = 'icon';
          document.head.appendChild(favicon);
        }
        favicon.href = fixImg(CONFIG.logo);
      }

      var primaryHex = resolveColor(CONFIG.corPrimaria) || '#3483FA';
      if (/^#?(fff|ffffff|white)$/i.test(primaryHex)) {
        primaryHex = '#3483FA';
      }

      document.documentElement.style.setProperty('--primary', primaryHex);
      var hex = primaryHex.replace('#', '');
      if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
      var r = parseInt(hex.substr(0, 2), 16) || 52;
      var g = parseInt(hex.substr(2, 2), 16) || 131;
      var b = parseInt(hex.substr(4, 2), 16) || 250;
      document.documentElement.style.setProperty('--primary-rgb', r + ', ' + g + ', ' + b);
      document.documentElement.style.setProperty('--primary-light', 'rgba(' + r + ', ' + g + ', ' + b + ', 0.08)');
      
      var hr = Math.max(0, Math.round(r * 0.82));
      var hg = Math.max(0, Math.round(g * 0.82));
      var hb = Math.max(0, Math.round(b * 0.82));
      document.documentElement.style.setProperty('--primary-hover', 'rgb(' + hr + ', ' + hg + ', ' + hb + ')');

      var secondaryHex = darkenColor(primaryHex, 0.18);
      document.documentElement.style.setProperty('--secondary', secondaryHex);

      if (CONFIG.bannerUrl) {
        const banner = document.getElementById('bannerSection');
        const hasLink = CONFIG.bannerLink;
        let overlayHTML = '';
        if (CONFIG.bannerTag || CONFIG.bannerTitulo || CONFIG.bannerSubtitulo) {
          overlayHTML = `<div class="banner-overlay">
        ${CONFIG.bannerTag ? `<div class="banner-tag">${CONFIG.bannerTag}</div>` : ''}
        ${CONFIG.bannerTitulo ? `<div class="banner-title">${CONFIG.bannerTitulo}</div>` : ''}
        ${CONFIG.bannerSubtitulo ? `<div class="banner-sub">${CONFIG.bannerSubtitulo}</div>` : ''}
      </div>`;
        }
        let wrapperOpen, wrapperClose;
        if (hasLink && hasLink.startsWith('http')) {
          wrapperOpen = `<a href="${hasLink}" class="banner-wrap">`;
          wrapperClose = `</a>`;
        } else if (hasLink) {
          wrapperOpen = `<div class="banner-wrap" style="cursor:pointer" onclick="bannerFilter('${hasLink.replace(/'/g, "\\'")}')">`;
          wrapperClose = `</div>`;
        } else {
          wrapperOpen = `<div class="banner-wrap">`;
          wrapperClose = `</div>`;
        }
        banner.innerHTML = `${wrapperOpen}
      <img class="banner-img" src="${fixImg(CONFIG.bannerUrl)}" alt="Banner" onerror="this.parentElement.parentElement.style.display='none'">
      ${overlayHTML}
    ${wrapperClose}`;
        banner.classList.add('show');
      }

      const socials = document.getElementById('footerSocials');
      let socialsHTML = '';
      if (CONFIG.canalWhatsapp) socialsHTML += '<a href="' + CONFIG.canalWhatsapp + '" target="_blank" title="Canal de Ofertas no WhatsApp"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z\'/></svg>Entrar no Canal de Ofertas</a>' : '') + '</div></div>';
          return;
        }
        applyConfig();
        buildCategoryNav();
        renderProducts();

        var urlParams = new URLSearchParams(window.location.search);
        var productSlug = urlParams.get('produto');
        if (productSlug) {
          var foundIndex = PRODUCTS.findIndex(function(p) {
            return p.ativo && toSlug(p.nome) === productSlug;
          });
          if (foundIndex !== -1) {
            setTimeout(function() { openProductModal(foundIndex); }, 300);
          }
        }
        document.getElementById("loadingScreen").classList.add("hidden");
        setTimeout(() => document.getElementById("loadingScreen").remove(), 500);
      } catch (err) {
        console.error("Planiloja Achadinhos Error:", err);
        document.getElementById("loadingScreen").style.display = "none";
        document.getElementById("errorScreen").classList.add("show");
      }
    }

    init();
  </script>
